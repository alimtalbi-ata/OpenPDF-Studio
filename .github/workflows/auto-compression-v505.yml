name: V51.3 PDF compression safety regression
on:
  pull_request:
    paths:
      - '03-Sources/openpdf_auto_compression_v505.py'
      - '03-Sources/openpdf_compression_evidence_v506.py'
      - '03-Sources/openpdf_compression_coverage_v507.py'
      - '03-Sources/openpdf_compression_alpha_v508.py'
      - '02-Compilation/package_cumulative_v434.py'
      - '04-Tests-et-Qualification/test_zip_determinism_v507.py'
      - '03-Sources/openpdf_compression_v327.py'
      - '04-Tests-et-Qualification/test_auto_compression_v505.py'
      - '04-Tests-et-Qualification/test_compression_evidence_v506.py'
      - '04-Tests-et-Qualification/test_compression_coverage_v507.py'
      - '04-Tests-et-Qualification/test_compression_alpha_v508.py'
      - '.github/workflows/auto-compression-v505.yml'
      - 'VERSION.txt'
      - '07-Manifestes/V51.3-REQUIRED-RUNTIME-MODULES.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auto-compression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production PDF engine
        run: python -m pip install "pymupdf>=1.24,<2"
      - name: Compile production and test modules
        run: python -m compileall -q 03-Sources/openpdf_auto_compression_v505.py 03-Sources/openpdf_compression_evidence_v506.py 03-Sources/openpdf_compression_coverage_v507.py 03-Sources/openpdf_compression_alpha_v508.py 03-Sources/openpdf_compression_v327.py 04-Tests-et-Qualification/test_auto_compression_v505.py 04-Tests-et-Qualification/test_compression_alpha_v508.py
      - name: Real-PDF automatic selection and safety tests
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_auto_compression_v505.py -v
      - name: Measured receipt integrity and real-PDF regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_compression_evidence_v506.py -v
      - name: Independent complete-page and pixel coverage regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_compression_coverage_v507.py -v
      - name: Independent alpha-channel transparency fidelity and rejection
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_compression_alpha_v508.py -v
      - name: Deterministic ZIP release metadata regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_zip_determinism_v507.py -v
      - name: Prior compression benchmark regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_compression_benchmark_v504.py -v
      - name: GUI opt-in and overwrite regressions
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_auto_compression_v505.py -v
      - name: Static runtime dependency closure (not Windows binary qualification)
        run: python 03-Sources/openpdf_source_closure_v502.py --root . --entry openpdf_studio --entry openpdf_auto_compression_v505 --required-manifest 07-Manifestes/V51.3-REQUIRED-RUNTIME-MODULES.json

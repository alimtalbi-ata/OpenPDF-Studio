name: PDF metadata fidelity V50.1
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-functional:
    name: Real PDF tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF
        run: python -m pip install "PyMuPDF>=1.24,<2"
      - name: Compile touched modules
        run: python -m py_compile 03-Sources/openpdf_metadata_fidelity_v501.py 03-Sources/openpdf_page_service_v345.py
      - name: Real PDF extraction, reorder and metadata fidelity
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_metadata_fidelity_v501.py -v
      - name: Previous extraction regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_extraction_selection_v500.py -v

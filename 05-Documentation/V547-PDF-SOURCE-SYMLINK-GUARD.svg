<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">OpenPDF Studio V547 — garde de chemin source avant canonicalisation</title>
  <desc id="desc">Schéma de conception du refus d’un lien symbolique source avant résolution, puis des contrôles d’intégrité et de publication pour un chemin régulier.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#35516b"/></marker>
    <style>
      .box{fill:#f6f9fc;stroke:#35516b;stroke-width:2;rx:14}
      .gate{fill:#fff5dc;stroke:#986a12;stroke-width:2}
      .reject{fill:#fff0f0;stroke:#a82b39;stroke-width:2;rx:12}
      .good{fill:#eaf7f0;stroke:#247348;stroke-width:2;rx:12}
      .t{font-family:Segoe UI,Arial,sans-serif;fill:#183247;font-size:17px;font-weight:600}
      .s{font-family:Segoe UI,Arial,sans-serif;fill:#24465e;font-size:14px}
      .line{stroke:#35516b;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .caption{font-family:Segoe UI,Arial,sans-serif;fill:#526879;font-size:13px}
    </style>
  </defs>
  <rect x="20" y="18" width="1080" height="484" rx="18" fill="#ffffff" stroke="#c8d5df"/>
  <text x="48" y="54" class="t" style="font-size:22px">V547 — Validation du chemin source PDF</text>
  <text x="48" y="77" class="s">Le chemin lexical est contrôlé avant que resolve() suive une cible de lien.</text>
  <rect class="box" x="55" y="130" width="220" height="96"/>
  <text class="t" x="165" y="163" text-anchor="middle">Chemin fourni</text>
  <text class="s" x="165" y="188" text-anchor="middle">Path.expanduser()</text>
  <text class="s" x="165" y="207" text-anchor="middle">nom d’origine</text>
  <path class="line" d="M275 178 H345"/>
  <polygon class="gate" points="425,118 505,178 425,238 345,178"/>
  <text class="t" x="425" y="166" text-anchor="middle">is_symlink()</text>
  <text class="s" x="425" y="187" text-anchor="middle">avant resolve</text>
  <path class="line" d="M505 178 H600"/>
  <text class="s" x="548" y="160" text-anchor="middle">non</text>
  <rect class="good" x="600" y="130" width="220" height="96"/>
  <text class="t" x="710" y="163" text-anchor="middle">Résolution stricte</text>
  <text class="s" x="710" y="188" text-anchor="middle">puis recontrôle lexical</text>
  <path class="line" d="M710 226 V286"/>
  <rect class="box" x="570" y="286" width="280" height="78"/>
  <text class="t" x="710" y="316" text-anchor="middle">Empreinte et opération</text>
  <text class="s" x="710" y="340" text-anchor="middle">fusion / extraction / split / ordre</text>
  <path class="line" d="M710 364 V408"/>
  <rect class="good" x="570" y="408" width="280" height="55"/>
  <text class="t" x="710" y="441" text-anchor="middle">Contrôles puis sortie exclusive</text>
  <path class="line" d="M425 238 V315 H500"/>
  <rect class="reject" x="310" y="286" width="190" height="78"/>
  <text class="t" x="405" y="316" text-anchor="middle">Refus immédiat</text>
  <text class="s" x="405" y="340" text-anchor="middle">aucune sortie publiée</text>
  <text class="s" x="515" y="275">oui</text>
  <text class="caption" x="48" y="478">Schéma d’architecture V547 — ce dessin n’est pas une preuve d’exécution ni une capture d’interface.</text>
</svg>

name: DOCX release guard V49.5
on:
  pull_request:
    paths:
      - '02-Compilation/openpdf_release_guard_v494.py'
      - '02-Compilation/openpdf_docx_safety_v495.py'
      - '04-Tests-et-Qualification/test_docx_safety_v495.py'
      - '.github/workflows/docx-release-guard-v495.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ooxml-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate OOXML security guard
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_docx_safety_v495.py -v

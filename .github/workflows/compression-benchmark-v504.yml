name: V50.4 measured PDF compression acceptance
on:
  pull_request:
    paths:
      - '03-Sources/openpdf_compression_benchmark_v504.py'
      - '04-Tests-et-Qualification/test_compression_benchmark_v504.py'
      - '.github/workflows/compression-benchmark-v504.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-pdf-compression:
    name: Real PDF size/quality checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production PDF engine
        run: python -m pip install "pymupdf>=1.24,<2"
      - name: Compile benchmark and production compression services
        run: python -m compileall -q 03-Sources/openpdf_compression_benchmark_v504.py 03-Sources/openpdf_compression_service_v344.py
      - name: Run real-PDF compression and fail-closed regression tests
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_compression_benchmark_v504.py -v
      - name: Recheck full-pixel acceptance regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_compression_acceptance_v489.py -v

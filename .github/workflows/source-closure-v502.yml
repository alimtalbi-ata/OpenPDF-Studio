name: V51.4 reconciled source and Windows portable qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  closure-unit-tests:
    name: Source reconciliation and regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Office test dependencies
        run: python -m pip install "PyMuPDF>=1.24,<2" "python-docx>=1.1,<2" "python-pptx>=1.0,<2" "openpyxl>=3.1,<4" "Pillow>=10,<13"
      - name: Verify source snapshot includes single Windows launcher
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_source_snapshot_v518.py -v
      - name: Test source closure and reconciled source hashes
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_source_reconciliation_v503.py -v
      - name: Test versioned Windows packaging preflight contract
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_windows_single_command_v472.py -v
      - name: Test 15 runtime publication and integrity regressions
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_runtime_reconciliation_v503.py -v
      - name: Test version-aware Windows tag-release workflow (static contract)
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_windows_release_dynamic_v508.py -v
      - name: Test V51.4 Windows uninstall cleanup contract
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_windows_installer_cleanup_v504.py -v
      - name: Test V51.4 scanned-page Office conversion gate (real synthetic PDFs)
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_office_scan_gate_v510.py -v
      - name: Test V51.4 OCR-to-Office pipeline (offline, functional)
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_ocr_office_pipeline_v511.py -v
      - name: Test V51.4 GUI OCR Office routing and symlink regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_ocr_office_gui_v512.py -v
      - name: Test V51.4 OCR model resolver and real engine
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_ocr_runtime_v513.py -v
      - name: Test original V50.2 closure regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_source_closure_v502.py -v
      - name: Test V548 evidence reconciliation and guide freshness
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_v548_ci_qualification_report.py -v
      - name: Test V549 evidence reconciliation and guide freshness
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_v549_ci_qualification_report.py -v
      - name: Test V550 evidence parsing and stale-guide rejection
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_v550_ci_qualification_report.py -v
      - name: Test V551 Windows-native receipt parsing and stale-guide rejection
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_v551_ci_qualification_report.py -v
      - name: Test cumulative release SHA256 manifest generation and legacy labeling
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_package_integrity_manifest_v552.py -v
      - name: Test V553 Unicode-normalized release archive path collisions
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_package_path_normalization_v553.py -v
      - name: Test V554 ZIP decompression-amplification limits
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_package_expansion_ratio_v554.py -v
  source-readiness:
    name: Full application source closure (release-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check checked-out source tree and version
        run: >
          python 03-Sources/openpdf_source_closure_v502.py
          --root .
          --entry openpdf_studio
          --entry openpdf_build_preflight
          --entry openpdf_inno_recipe_v491
          --entry openpdf_release_gate
          --entry openpdf_bind_smoke
          --entry openpdf_publish_binary
          --entry openpdf_binary_manifest
          --required-manifest 07-Manifestes/V51.4-REQUIRED-RUNTIME-MODULES.json
          --report source-closure.json
      - name: Preserve evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v514-source-closure-evidence
          path: source-closure.json
          if-no-files-found: warn
      - name: Preserve validated source snapshot for cumulative packaging
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v514-reconciled-source-snapshot
          path: |
            VERSION.txt
            BUILD-OPENPDF-WINDOWS.cmd
            .gitattributes
            .github/workflows/*.yml
            02-Compilation/**
            03-Sources/**
            04-Tests-et-Qualification/*.py
            05-Documentation/*.md
            07-Manifestes/*.json
            !**/__pycache__/**
            !**/.venv/**
            !**/dist/**
            !**/build/**
            !**/*.exe
            !**/*.zip
          include-hidden-files: true
          if-no-files-found: error
  windows-portable-build:
    name: Native Windows portable build and smoke
    needs: [closure-unit-tests, source-readiness]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable using the supported single CMD entrypoint
        shell: cmd
        run: call 02-Compilation\BUILD-WINDOWS-INSTALLER.cmd --portable-only
      - name: Validate bounded Windows smoke report
        shell: pwsh
        run: |
          $path = '01-Application/binary/windows-smoke-portable.json'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Smoke evidence missing' }
          if ((Get-Item -LiteralPath $path).Length -gt 65536) { throw 'Smoke evidence exceeds 64 KiB' }
          $report = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if (-not $report.passed -or $report.checks.Count -ne 3) { throw 'Smoke evidence incomplete' }
          foreach ($check in $report.checks) {
            if ($check.stdout -isnot [string] -or $check.stderr -isnot [string]) { throw 'Non-text smoke evidence' }
            if (-not $check.passed) { throw 'Failed smoke check' }
          }
      - name: Publish actual Windows build evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v514-windows-portable-build-evidence
          path: |
            01-Application/binary/*.log
            01-Application/binary/*.json
            01-Application/binary/*.exe
          if-no-files-found: warn

  windows-installer-build:
    name: Native Windows installer, install and uninstall
    needs: [closure-unit-tests, source-readiness]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure Inno Setup compiler is available
        shell: pwsh
        run: |
          $paths = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe'),
            'C:/ProgramData/chocolatey/bin/ISCC.exe'
          )
          if (-not ($paths | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install innosetup --yes --no-progress
          }
      - name: Build installer and execute native install/uninstall smoke
        shell: cmd
        run: call 02-Compilation\BUILD-WINDOWS-INSTALLER.cmd --installer-only
      - name: Verify native installation evidence
        shell: pwsh
        run: |
          $path = '01-Application/binary/windows-installation-v51.4.json'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Installation evidence missing' }
          $report = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if (-not $report.passed -or $report.version -ne '51.4') { throw 'Installation failed' }
          if ($report.cleanup_error) { throw 'Unexpected installer cleanup error' }
          foreach ($step in @('silent_install_pass','installed_launch_pass','installed_ocr_pass','silent_uninstall_pass')) {
            if ($report.steps -notcontains $step) { throw "Missing installation step: $step" }
          }
      - name: Preserve actual installer and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v514-windows-installer-build-evidence
          path: |
            01-Application/binary/*.log
            01-Application/binary/*.json
            01-Application/binary/*Setup.exe
          if-no-files-found: warn

  windows-cumulative-package:
    name: Assemble and verify cumulative ZIP from qualified Windows artifacts
    needs: [closure-unit-tests, source-readiness, windows-portable-build, windows-installer-build]
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OPENPDF_REPOSITORY: ${{ github.repository }}
      OPENPDF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENPDF_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENPDF_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
      OPENPDF_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
      OPENPDF_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download portable Windows build evidence
        uses: actions/download-artifact@v4
        with:
          name: v514-windows-portable-build-evidence
          path: ${{ runner.temp }}/v549-portable
      - name: Download installer Windows build evidence
        uses: actions/download-artifact@v4
        with:
          name: v514-windows-installer-build-evidence
          path: ${{ runner.temp }}/v549-installer
      - name: Assemble exact binaries and their native receipts
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION.txt -Raw).Trim()
          if ($version -ne '51.4') { throw "Unexpected application version: $version" }
          "OPENPDF_VERSION=$version" >> $env:GITHUB_ENV
          $binary = Join-Path $env:GITHUB_WORKSPACE '01-Application/binary'
          if (Test-Path -LiteralPath $binary) { Remove-Item -LiteralPath $binary -Recurse -Force }
          New-Item -ItemType Directory -Path $binary -Force | Out-Null
          $portable = Join-Path $env:RUNNER_TEMP 'v549-portable'
          $installer = Join-Path $env:RUNNER_TEMP 'v549-installer'
          $copy = @(
            @{ From = (Join-Path $portable "OpenPDF-Studio-Portable-V$version.exe"); Name = "OpenPDF-Studio-Portable-V$version.exe" },
            @{ From = (Join-Path $portable 'windows-smoke-portable.json'); Name = 'windows-smoke-portable.json' },
            @{ From = (Join-Path $installer "OpenPDF-Studio-V$version-Setup.exe"); Name = "OpenPDF-Studio-V$version-Setup.exe" },
            @{ From = (Join-Path $installer 'windows-smoke-installer.json'); Name = 'windows-smoke-installer.json' },
            @{ From = (Join-Path $installer "windows-installation-v$version.json"); Name = "windows-installation-v$version.json" }
          )
          foreach ($item in $copy) {
            if (-not (Test-Path -LiteralPath $item.From -PathType Leaf)) { throw "Required qualified evidence missing: $($item.Name)" }
            Copy-Item -LiteralPath $item.From -Destination (Join-Path $binary $item.Name)
          }
      - name: Rebuild combined binary manifest
        shell: pwsh
        run: |
          py -3.12 03-Sources/openpdf_binary_manifest.py 01-Application/binary
          if ($LASTEXITCODE -ne 0) { throw 'Combined binary manifest generation failed' }
          py -3.12 -m pip install "python-docx>=1.1,<2" "reportlab>=4,<5" "pypdf>=5,<7" "Pillow>=10,<13"
          if ($LASTEXITCODE -ne 0) { throw 'Documentation dependencies failed to install' }
      - name: Reconcile exact V549 CI and native Windows receipts
        shell: pwsh
        env:
          OPENPDF_GITHUB_TOKEN: ${{ github.token }}
        run: |
          py -3.12 02-Compilation/write_v549_ci_qualification.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'V549 CI receipts did not reconcile to this exact source SHA' }
          py -3.12 02-Compilation/write_v550_ci_qualification.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'V550 CI receipts did not reconcile to this exact source SHA' }
          py -3.12 02-Compilation/write_v551_ci_qualification.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'V551 native Windows handle-publication tests did not reconcile to this exact source SHA' }
      - name: Generate versioned Word/PDF guide from reconciled evidence
        shell: pwsh
        run: |
          py -3.12 02-Compilation/generate_release_docs.py
          if ($LASTEXITCODE -ne 0) { throw 'Versioned Word/PDF generation failed' }
          py -3.12 02-Compilation/generate_docs_v549.py
          if ($LASTEXITCODE -ne 0) { throw 'V549-specific Word/PDF qualification guide generation failed' }
          py -3.12 02-Compilation/generate_docs_v550.py
          if ($LASTEXITCODE -ne 0) { throw 'V550-specific Word/PDF qualification guide generation failed' }
          py -3.12 02-Compilation/generate_docs_v551.py
          if ($LASTEXITCODE -ne 0) { throw 'V551-specific Word/PDF qualification guide generation failed' }
      - name: Build the cumulative ZIP and verify CRC, inventory and binary receipts
        shell: pwsh
        run: |
          $version = $env:OPENPDF_VERSION
          $zip = Join-Path $env:GITHUB_WORKSPACE "01-Application/release/OpenPDF Studio V$version --- Windows Cumulative.zip"
          py -3.12 02-Compilation/package_cumulative_v434.py --root . --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Cumulative ZIP creation failed' }
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'Cumulative ZIP missing' }
          $resultText = py -3.12 02-Compilation/package_cumulative_v434.py --verify $zip
          if ($LASTEXITCODE -ne 0) { throw 'Cumulative ZIP verification failed' }
          $result = ($resultText -join [Environment]::NewLine) | ConvertFrom-Json
          if ($result.verified_files -lt 100 -or $result.archive_bytes -le 0) { throw 'Incomplete archive verification receipt' }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $result.archive_sha256) { throw 'ZIP SHA-256 differs from internal verification receipt' }
          "$hash  $(Split-Path -Leaf $zip)" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii
          $resultText | Set-Content -LiteralPath 'cumulative-package-verification.json' -Encoding utf8
      - name: Upload verified cumulative ZIP, SHA-256 and qualification receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenPDF-Studio-V${{ env.OPENPDF_VERSION }}-V551-Cumulative-Windows
          path: |
            01-Application/release/*.zip
            01-Application/release/*.zip.sha256
            cumulative-package-verification.json
          if-no-files-found: error

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
<title id="title">OpenPDF Studio V544 — mesures de fidélité Office</title>
<desc id="desc">Référence indépendante et objet Office éditable alimentent les mesures de précision, rappel, F1 et rappel ordonné de séquence. Les décisions s’appliquent aux seuils et un reçu agrégé sans texte métier est publié.</desc>
<rect width="1040" height="360" rx="16" fill="#f7f9fc"/>
<text x="32" y="38" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#15304b">V544 — qualification du contenu Office éditable</text>
<g font-family="Segoe UI,Arial" font-size="15" fill="#15304b" stroke="#426782" stroke-width="1.5">
  <rect x="32" y="80" width="210" height="78" rx="10" fill="#e6f2ff"/>
  <text x="137" y="110" text-anchor="middle" stroke="none" font-weight="700">Référence annotée</text>
  <text x="137" y="134" text-anchor="middle" stroke="none">SHA-256 liée au PDF</text>
  <rect x="32" y="210" width="210" height="78" rx="10" fill="#e7f7ef"/>
  <text x="137" y="240" text-anchor="middle" stroke="none" font-weight="700">DOCX / XLSX / PPTX</text>
  <text x="137" y="264" text-anchor="middle" stroke="none">Objets natifs éditables</text>
  <rect x="340" y="112" width="310" height="144" rx="12" fill="#ffffff"/>
  <text x="495" y="145" text-anchor="middle" stroke="none" font-weight="700">Mesures déterministes</text>
  <text x="495" y="174" text-anchor="middle" stroke="none">Précision • Rappel • F1</text>
  <text x="495" y="200" text-anchor="middle" stroke="none">Tokens supplémentaires</text>
  <text x="495" y="226" text-anchor="middle" stroke="none">Rappel ordonné de séquence</text>
  <rect x="748" y="80" width="260" height="78" rx="10" fill="#fff3d9"/>
  <text x="878" y="110" text-anchor="middle" stroke="none" font-weight="700">Seuils V544</text>
  <text x="878" y="134" text-anchor="middle" stroke="none">PASS / FAIL</text>
  <rect x="748" y="210" width="260" height="78" rx="10" fill="#ece8ff"/>
  <text x="878" y="240" text-anchor="middle" stroke="none" font-weight="700">Reçu JSON agrégé</text>
  <text x="878" y="264" text-anchor="middle" stroke="none">Liste blanche, sans texte</text>
</g>
<g stroke="#426782" stroke-width="2" fill="none" stroke-linecap="round">
  <path d="M242 119 H285 V150 H340"/><path d="M242 249 H285 V220 H340"/>
  <path d="M650 150 H700 V119 H748"/><path d="M650 220 H700 V249 H748"/>
  <path d="M738 110 l10 9 -10 9"/><path d="M738 240 l10 9 -10 9"/>
</g>
<text x="32" y="330" font-family="Segoe UI,Arial" font-size="13" fill="#5b6875">Limite : ordre d’extraction OOXML ≠ ordre de lecture visuel ; fidélité géométrique et typographique non mesurée.</text>
</svg>

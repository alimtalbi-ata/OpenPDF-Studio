name: V539 OCR independent reference corpus and real Tesseract regression
on:
  pull_request:
    paths:
      - '03-Sources/openpdf_ocr_reference_corpus_v539.py'
      - '04-Tests-et-Qualification/test_ocr_reference_*_v539.py'
      - '.github/workflows/ocr-reference-corpus-v539.yml'
  push:
    branches:
      - 'feature/v51.4-ocr-reference-corpus-v539-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-corpus-functional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python -m pip install "PyMuPDF>=1.24,<2"
      - name: Compile OCR corpus and baseline CER/WER modules
        run: python -m py_compile 03-Sources/openpdf_ocr_reference_corpus_v539.py 03-Sources/openpdf_ocr_quality_v487.py
      - name: Run 14 deterministic PDF corpus tests
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_ocr_reference_corpus_v539.py -v
  reference-corpus-real-tesseract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tesseract English and PyMuPDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
          python -m pip install "PyMuPDF>=1.24,<2"
      - name: Qualify actual Tesseract PDF conversion (not human-labelled)
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_ocr_reference_real_v539.py -v

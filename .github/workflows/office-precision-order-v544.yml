name: V544 Office precision and extracted-object order
on:
  pull_request:
    paths:
      - '03-Sources/openpdf_office_reference_v542.py'
      - '03-Sources/openpdf_precision_order_v544.py'
      - '03-Sources/openpdf_office_precision_order_ui_v544.py'
      - '03-Sources/openpdf_office_quality_ui_v543.py'
      - '03-Sources/openpdf_desktop.py'
      - '04-Tests-et-Qualification/test_office_precision_order_v544.py'
      - '04-Tests-et-Qualification/test_office_quality_ui_v543.py'
      - '07-Manifestes/V51.4-REQUIRED-RUNTIME-MODULES.json'
      - '07-Manifestes/V51.4-SOURCE-HASH-OVERRIDES.json'
      - '.github/workflows/office-precision-order-v544.yml'
  push:
    branches:
      - 'feature/v51.4-office-precision-order-v544-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  office-precision-order:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF and editable Office test dependencies
        run: python -m pip install "PyMuPDF>=1.24,<2" "python-docx>=1.1,<2" "python-pptx>=1.0,<2" "openpyxl>=3.1,<4" "Pillow>=10,<13"
      - name: Compile V542/V544 evaluators, GUI adapter and tests
        run: python -m py_compile 03-Sources/openpdf_office_reference_v542.py 03-Sources/openpdf_precision_order_v544.py 03-Sources/openpdf_office_precision_order_ui_v544.py 03-Sources/openpdf_desktop.py 04-Tests-et-Qualification/test_office_precision_order_v544.py 04-Tests-et-Qualification/test_office_quality_ui_v543.py
      - name: V544 precision, extras, order, privacy and adversarial tests
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_office_precision_order_v544.py -v
      - name: V542 reference regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_office_reference_v542.py -v
      - name: V543 adapter and GUI wiring regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_office_quality_ui_v543.py -v
      - name: V539 OCR reference regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_ocr_reference_corpus_v539.py -v
  linux-real-office-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk, Xvfb and document libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb python3-tk
          python -m pip install "PyMuPDF>=1.24,<2" "python-docx>=1.1,<2" "python-pptx>=1.0,<2" "openpyxl>=3.1,<4" "Pillow>=10,<13"
      - name: Actual Tk dialog, asynchronous worker, V2 receipt and no-overwrite regression
        run: OPENPDF_RUN_GUI_TEST=1 xvfb-run -a python -m unittest discover -s 04-Tests-et-Qualification -p test_office_quality_ui_v543.py -v

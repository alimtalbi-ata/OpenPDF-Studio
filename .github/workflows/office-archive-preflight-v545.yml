name: V545 Office archive integrity and Windows path safety
on:
  pull_request:
    paths:
      - '03-Sources/openpdf_office_reference_v542.py'
      - '04-Tests-et-Qualification/test_office_archive_preflight_v545.py'
      - '04-Tests-et-Qualification/test_office_reference_v542.py'
      - '07-Manifestes/V51.4-SOURCE-HASH-OVERRIDES.json'
      - '.github/workflows/office-archive-preflight-v545.yml'
  push:
    branches:
      - 'feature/v51.4-office-archive-integrity-v545-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded Office archive test dependencies
        run: python -m pip install "PyMuPDF>=1.24,<2" "python-docx>=1.1,<2" "python-pptx>=1.0,<2" "openpyxl>=3.1,<4" "Pillow>=10,<13"
      - name: Compile updated evaluator and tests
        run: python -m py_compile 03-Sources/openpdf_office_reference_v542.py 04-Tests-et-Qualification/test_office_archive_preflight_v545.py 04-Tests-et-Qualification/test_office_reference_v542.py
      - name: V545 archive CRC and path-safety regression tests
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_office_archive_preflight_v545.py -v
      - name: V542 conversion, privacy, and active-content regressions
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_office_reference_v542.py -v

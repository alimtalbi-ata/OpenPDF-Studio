name: PDF page reorganisation V49.7
on:
  pull_request:
    paths:
      - '03-Sources/openpdf_page_order_v497.py'
      - '03-Sources/openpdf_page_service_v345.py'
      - '03-Sources/openpdf_operations.py'
      - '03-Sources/openpdf_ui_controller_v348.py'
      - '03-Sources/openpdf_desktop.py'
      - '04-Tests-et-Qualification/test_page_order_v497.py'
      - '04-Tests-et-Qualification/test_page_keywords_v498.py'
      - '04-Tests-et-Qualification/test_page_exclusions_v499.py'
      - '04-Tests-et-Qualification/test_page_source_symlink_v547.py'
      - '.github/workflows/page-order-v497.yml'
  workflow_dispatch:
jobs:
  page-order-functional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF for real PDF tests
        run: python -m pip install "pymupdf>=1.24,<2"
      - name: Compile page and dispatcher modules
        run: python -m compileall -q 03-Sources/openpdf_page_order_v497.py 03-Sources/openpdf_page_service_v345.py 03-Sources/openpdf_operations.py 03-Sources/openpdf_ui_controller_v348.py
      - name: Run parser and real-PDF regression suite
        run: |
          python -m unittest discover -s 04-Tests-et-Qualification -p test_page_order_v497.py -v
          python -m unittest discover -s 04-Tests-et-Qualification -p test_page_keywords_v498.py -v
          python -m unittest discover -s 04-Tests-et-Qualification -p test_page_exclusions_v499.py -v
      - name: V547 reject PDF source symlinks before path canonicalization
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_page_source_symlink_v547.py -v

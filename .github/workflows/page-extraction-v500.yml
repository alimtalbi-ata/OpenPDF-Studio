name: PDF extraction selection V50.0
on:
  pull_request:
    paths:
      - '03-Sources/openpdf_ui_controller_v348.py'
      - '03-Sources/openpdf_desktop.py'
      - '03-Sources/openpdf_page_order_v497.py'
      - '04-Tests-et-Qualification/test_extraction_selection_v500.py'
      - '.github/workflows/page-extraction-v500.yml'
  workflow_dispatch:
jobs:
  extraction-functional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependency
        run: python -m pip install "pymupdf>=1.24,<2"
      - name: Static Python compilation
        run: python -m compileall -q 03-Sources/openpdf_ui_controller_v348.py 03-Sources/openpdf_desktop.py 03-Sources/openpdf_page_order_v497.py
      - name: Functional extraction on real PDF documents
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_extraction_selection_v500.py -v

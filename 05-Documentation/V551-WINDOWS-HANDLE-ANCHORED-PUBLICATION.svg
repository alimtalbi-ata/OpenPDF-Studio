<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img" aria-labelledby="title desc">
<title id="title">OpenPDF Studio V551 — publication Windows ancrée sur handles</title>
<desc id="desc">Ouverture de chaque parent sans reparse point, maintien des handles, publication exclusive par FileLinkInformation, contrôle d'identité. Les chemins non pris en charge échouent fermés.</desc>
<rect width="1240" height="500" fill="#f7fafc"/>
<text x="40" y="43" font-family="Segoe UI,Arial" font-size="25" font-weight="700" fill="#16324f">V551 — Publication Windows par handles</text>
<text x="40" y="72" font-family="Segoe UI,Arial" font-size="14" fill="#486581">Backend natif NT • lien dur exclusif • pas de repli silencieux</text>
<g font-family="Segoe UI,Arial" font-size="14" text-anchor="middle">
  <rect x="40" y="122" width="210" height="102" rx="12" fill="#e3f2fd" stroke="#2878a5" stroke-width="2"/>
  <text x="145" y="155" font-weight="700" fill="#16324f">Parcours du parent</text>
  <text x="145" y="180" fill="#16324f">NtCreateFile relatif</text>
  <text x="145" y="201" fill="#16324f">OBJ_DONT_REPARSE</text>
  <rect x="285" y="122" width="210" height="102" rx="12" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="390" y="155" font-weight="700" fill="#1b5e20">Handle épinglé</text>
  <text x="390" y="180" fill="#1b5e20">Répertoires ordinaires</text>
  <text x="390" y="201" fill="#1b5e20">Identité volume/fichier</text>
  <rect x="530" y="122" width="210" height="102" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="635" y="155" font-weight="700" fill="#7f3b00">Temporaire ouvert</text>
  <text x="635" y="180" fill="#7f3b00">Sans reparse point</text>
  <text x="635" y="201" fill="#7f3b00">Partage de suppression fermé</text>
  <rect x="775" y="122" width="210" height="102" rx="12" fill="#ede7f6" stroke="#6a1b9a" stroke-width="2"/>
  <text x="880" y="155" font-weight="700" fill="#4a148c">Publication exclusive</text>
  <text x="880" y="180" fill="#4a148c">FileLinkInformation</text>
  <text x="880" y="201" fill="#4a148c">ReplaceIfExists = false</text>
  <rect x="1020" y="122" width="180" height="102" rx="12" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="1110" y="155" font-weight="700" fill="#004d40">Contrôle final</text>
  <text x="1110" y="180" fill="#004d40">Même inode</text>
  <text x="1110" y="201" fill="#004d40">Parent toujours épinglé</text>
</g>
<g fill="none" stroke="#627d98" stroke-width="2.5">
  <path d="M250 173 H285"/><path d="M495 173 H530"/><path d="M740 173 H775"/><path d="M985 173 H1020"/>
  <path d="M265 170 l-8 -5 v10 z" fill="#627d98"/><path d="M510 170 l-8 -5 v10 z" fill="#627d98"/><path d="M755 170 l-8 -5 v10 z" fill="#627d98"/><path d="M1000 170 l-8 -5 v10 z" fill="#627d98"/>
</g>
<rect x="40" y="275" width="565" height="142" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="64" y="307" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#16324f">Refus fermé</text>
<text x="64" y="337" font-family="Segoe UI,Arial" font-size="14" fill="#334e68">• Chemins UNC et lecteurs réseau mappés</text>
<text x="64" y="361" font-family="Segoe UI,Arial" font-size="14" fill="#334e68">• Jonctions / reparse points et segments « .. »</text>
<text x="64" y="385" font-family="Segoe UI,Arial" font-size="14" fill="#334e68">• Volumes sans prise en charge du lien dur exclusif</text>
<rect x="635" y="275" width="565" height="142" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="659" y="307" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#16324f">Limites documentées</text>
<text x="659" y="337" font-family="Segoe UI,Arial" font-size="14" fill="#334e68">• La sortie peut être conservée si une course est détectée</text>
<text x="659" y="361" font-family="Segoe UI,Arial" font-size="14" fill="#334e68">• Les races TOCTOU ne sont pas toutes éliminées par cette PR</text>
<text x="659" y="385" font-family="Segoe UI,Arial" font-size="14" fill="#334e68">• La CI Windows native est requise pour revendiquer le PASS</text>
<text x="40" y="466" font-family="Segoe UI,Arial" font-size="12" fill="#486581">Auteur : Abdelhalim Talbi • Diagramme d’architecture (ce fichier n’est pas une capture d’interface).</text>
</svg>

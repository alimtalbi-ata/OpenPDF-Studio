name: PDF page reorganisation V49.7
on:
  pull_request:
    paths:
      - '03-Sources/openpdf_page_order_v497.py'
      - '03-Sources/openpdf_page_service_v345.py'
      - '03-Sources/openpdf_operations.py'
      - '03-Sources/openpdf_ui_controller_v348.py'
      - '03-Sources/openpdf_desktop.py'
      - '04-Tests-et-Qualification/test_page_order_v497.py'
      - '04-Tests-et-Qualification/test_page_keywords_v498.py'
      - '04-Tests-et-Qualification/test_page_exclusions_v499.py'
      - '04-Tests-et-Qualification/test_page_source_symlink_v547.py'
      - '03-Sources/openpdf_source_path_guard_v548.py'
      - '04-Tests-et-Qualification/test_source_path_chain_guard_v548.py'
      - '04-Tests-et-Qualification/test_v548_ci_qualification_report.py'
      - '03-Sources/openpdf_destination_path_guard_v549.py'
      - '03-Sources/openpdf_atomic_output.py'
      - '03-Sources/openpdf_windows_handle_publish_v551.py'
      - '04-Tests-et-Qualification/test_atomic_output_v551.py'
      - '04-Tests-et-Qualification/test_v551_ci_qualification_report.py'
      - '02-Compilation/write_v551_ci_qualification.py'
      - '02-Compilation/generate_docs_v551.py'
      - '05-Documentation/V551-WINDOWS-HANDLE-ANCHORED-PUBLICATION.*'
      - '05-Documentation/OpenPDF-Studio-V51.4-V551-Guide.*'
      - '06-Historique/V551-WINDOWS-HANDLE-ANCHORED-PUBLICATION.md'
      - '04-Tests-et-Qualification/test_destination_path_chain_guard_v549.py'
      - '04-Tests-et-Qualification/test_atomic_output_v550.py'
      - '04-Tests-et-Qualification/test_v550_ci_qualification_report.py'
      - '04-Tests-et-Qualification/test_v549_ci_qualification_report.py'
      - '02-Compilation/write_v549_ci_qualification.py'
      - '02-Compilation/generate_docs_v549.py'
      - '05-Documentation/V549-DESTINATION-PDF-PATH-CHAIN-GUARD.*'
      - '05-Documentation/V550-HANDLE-ANCHORED-PUBLICATION.*'
      - '05-Documentation/OpenPDF-Studio-V51.4-V550-Guide.*'
      - '02-Compilation/write_v550_ci_qualification.py'
      - '02-Compilation/generate_docs_v550.py'
      - '06-Historique/V550-HANDLE-ANCHORED-PUBLICATION.md'
      - '06-Historique/V549-DESTINATION-PDF-PATH-CHAIN-GUARD.md'
      - '02-Compilation/generate_docs_v514.py'
      - '02-Compilation/write_v548_ci_qualification.py'
      - '05-Documentation/V548-PDF-SOURCE-PATH-CHAIN-GUARD.*'
      - '06-Historique/V548-PDF-SOURCE-PATH-CHAIN-GUARD.md'
      - '.github/workflows/page-order-v497.yml'
  workflow_dispatch:
jobs:
  page-order-functional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF for real PDF tests
        run: python -m pip install "pymupdf>=1.24,<2"
      - name: Compile page, dispatcher, path guards and V551 Windows publisher
        run: python -m compileall -q 03-Sources/openpdf_page_order_v497.py 03-Sources/openpdf_page_service_v345.py 03-Sources/openpdf_operations.py 03-Sources/openpdf_ui_controller_v348.py 03-Sources/openpdf_source_path_guard_v548.py 03-Sources/openpdf_destination_path_guard_v549.py 03-Sources/openpdf_atomic_output.py 03-Sources/openpdf_windows_handle_publish_v551.py
      - name: Run parser and real-PDF regression suite
        run: |
          python -m unittest discover -s 04-Tests-et-Qualification -p test_page_order_v497.py -v
          python -m unittest discover -s 04-Tests-et-Qualification -p test_page_keywords_v498.py -v
          python -m unittest discover -s 04-Tests-et-Qualification -p test_page_exclusions_v499.py -v
      - name: V547 reject final-component PDF source symlinks before path canonicalization
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_page_source_symlink_v547.py -v
      - name: V548 reject linked parent components before path normalization
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_source_path_chain_guard_v548.py -v
      - name: V549 reject linked destination components before path normalization
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_destination_path_chain_guard_v549.py -v
      - name: V550 handle-anchored exclusive publication
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_atomic_output_v550.py -v
      - name: V551 native Windows handle-relative exclusive publication
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_atomic_output_v551.py -v

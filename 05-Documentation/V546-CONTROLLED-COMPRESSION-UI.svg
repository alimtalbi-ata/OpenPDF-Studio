<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">OpenPDF Studio V546 — parcours de compression contrôlée</title>
  <desc id="desc">Sélection du profil, consentement et aperçu pour les profils avec perte, essais, contrôles qualité, puis publication exclusive uniquement si un gain conforme est vérifié.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526579"/></marker>
    <style>
      .box { fill:#f5f8fc; stroke:#52718c; stroke-width:2; rx:12; }
      .gate { fill:#fff7e8; stroke:#a67524; stroke-width:2; rx:12; }
      .done { fill:#edf8f1; stroke:#28784b; stroke-width:2; rx:12; }
      .stop { fill:#fff0f0; stroke:#a34444; stroke-width:2; rx:12; }
      .title { font:700 17px 'Segoe UI',Arial,sans-serif; fill:#183247; }
      .body { font:14px 'Segoe UI',Arial,sans-serif; fill:#2c4355; }
      .line { fill:none; stroke:#526579; stroke-width:2.2; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="470" fill="#ffffff"/>
  <text x="38" y="38" class="title" font-size="22">V546 — Compression mesurée avec publication contrôlée</text>
  <rect class="box" x="36" y="72" width="210" height="100"/>
  <text x="54" y="101" class="title">1. Profil</text>
  <text x="54" y="127" class="body">Sûr · Standard</text>
  <text x="54" y="148" class="body">Images adaptatif · Auto</text>
  <rect class="gate" x="292" y="72" width="220" height="100"/>
  <text x="310" y="101" class="title">2. Consentement</text>
  <text x="310" y="127" class="body">Profils avec perte :</text>
  <text x="310" y="148" class="body">accord explicite + aperçu</text>
  <rect class="box" x="558" y="72" width="230" height="100"/>
  <text x="576" y="101" class="title">3. Essais privés</text>
  <text x="576" y="127" class="body">Candidats temporaires</text>
  <text x="576" y="148" class="body">Empreintes SHA-256</text>
  <rect class="gate" x="834" y="72" width="246" height="100"/>
  <text x="852" y="101" class="title">4. Contrôles fail-closed</text>
  <text x="852" y="127" class="body">Taille · RGB · alpha</text>
  <text x="852" y="148" class="body">structure PDF préservée</text>
  <path class="line" d="M246 122 H284"/>
  <path class="line" d="M512 122 H550"/>
  <path class="line" d="M788 122 H826"/>
  <path class="line" d="M957 172 V220"/>
  <rect class="done" x="834" y="228" width="246" height="88"/>
  <text x="852" y="257" class="title">Conforme + plus petit</text>
  <text x="852" y="282" class="body">Publication exclusive</text>
  <text x="852" y="301" class="body">source inchangée</text>
  <rect class="stop" x="558" y="228" width="230" height="88"/>
  <text x="576" y="257" class="title">Pas de candidat conforme</text>
  <text x="576" y="282" class="body">Aucun fichier publié</text>
  <text x="576" y="301" class="body">Statut no_output</text>
  <path class="line" d="M834 272 H796"/>
  <text x="36" y="374" class="title">Limite de preuve</text>
  <text x="36" y="400" class="body">Le contrôle raster est borné à une échelle donnée : il ne certifie pas PDF/A, impression, OCR, accessibilité ni fidélité métier.</text>
  <text x="36" y="425" class="body">Auteur : Abdelhalim Talbi · PR empilée sur V545 · main préservée</text>
</svg>

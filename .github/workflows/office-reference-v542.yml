name: V542 editable Office reference fidelity
on:
  pull_request:
    paths:
      - '03-Sources/openpdf_office_reference_v542.py'
      - '04-Tests-et-Qualification/test_office_reference_v542.py'
      - '.github/workflows/office-reference-v542.yml'
  push:
    branches:
      - 'feature/v51.4-office-reference-v542-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  office-reference-functional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline conversion and Office inspection dependencies
        run: python -m pip install "PyMuPDF>=1.24,<2" "python-docx>=1.1,<2" "python-pptx>=1.0,<2" "openpyxl>=3.1,<4" "Pillow>=10,<13"
      - name: Compile evaluator and tests
        run: python -m py_compile 03-Sources/openpdf_office_reference_v542.py 04-Tests-et-Qualification/test_office_reference_v542.py
      - name: Functional tests, real PDF-to-Office converter and security negatives
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_office_reference_v542.py -v
      - name: OCR reference baseline regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_ocr_reference_corpus_v539.py -v

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="420" viewBox="0 0 1160 420" role="img" aria-labelledby="title desc">
<title id="title">OpenPDF Studio V550 — publication ancrée</title>
<desc id="desc">Parcours de publication POSIX par descripteurs de répertoire et de fichier, avec contrôle d'identité avant et après la liaison exclusive. Windows garde son chemin de compatibilité et une limite TOCTOU explicite.</desc>
<rect width="1160" height="420" fill="#f7fafc"/>
<text x="36" y="42" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="#16324f">V550 — Publication PDF ancrée</text>
<text x="36" y="70" font-family="Segoe UI,Arial" font-size="13" fill="#486581">Chemins POSIX : handles ouverts, pas de suivi des liens, publication exclusive</text>
<g font-family="Segoe UI,Arial" font-size="14" text-anchor="middle">
  <rect x="36" y="115" width="195" height="90" rx="12" fill="#e3f2fd" stroke="#2878a5" stroke-width="2"/>
  <text x="133" y="149" font-weight="700" fill="#16324f">Fichier temporaire</text><text x="133" y="173" fill="#16324f">ouvrir O_NOFOLLOW</text>
  <rect x="276" y="115" width="195" height="90" rx="12" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="373" y="149" font-weight="700" fill="#1b5e20">Parent ancré</text><text x="373" y="173" fill="#1b5e20">openat + O_DIRECTORY</text>
  <rect x="516" y="115" width="195" height="90" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="613" y="149" font-weight="700" fill="#7f3b00">Publier sans écraser</text><text x="613" y="173" fill="#7f3b00">hard link exclusif</text>
  <rect x="756" y="115" width="195" height="90" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/>
  <text x="853" y="149" font-weight="700" fill="#1a237e">Vérifier l'inode</text><text x="853" y="173" fill="#1a237e">fsync + identité</text>
  <path d="M231 160 H270 M263 153 L270 160 L263 167 M471 160 H510 M503 153 L510 160 L503 167 M711 160 H750 M743 153 L750 160 L743 167" fill="none" stroke="#526d82" stroke-width="3"/>
  <rect x="36" y="255" width="515" height="105" rx="10" fill="#fff" stroke="#9fb3c8"/>
  <text x="58" y="284" text-anchor="start" font-weight="700" fill="#16324f">POSIX pris en charge</text>
  <text x="58" y="310" text-anchor="start" fill="#334e68">• Chaque composant est ouvert sans suivre les liens.</text>
  <text x="58" y="334" text-anchor="start" fill="#334e68">• Linux lie l'inode déjà ouvert via /proc/self/fd.</text>
  <rect x="577" y="255" width="547" height="105" rx="10" fill="#fff8e1" stroke="#f9a825"/>
  <text x="599" y="284" text-anchor="start" font-weight="700" fill="#7f3b00">Windows — limite conservée</text>
  <text x="599" y="310" text-anchor="start" fill="#7f3b00">• Précontrôle des reparse points et hard link exclusif.</text>
  <text x="599" y="334" text-anchor="start" fill="#7f3b00">• Pas de garantie complète contre TOCTOU.</text>
</g>
<text x="36" y="395" font-family="Segoe UI,Arial" font-size="12" fill="#627d98">Schéma technique statique — ce n'est pas une capture de l'application.</text>
</svg>

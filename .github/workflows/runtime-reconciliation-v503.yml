name: V50.3 runtime source reconciliation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restored-runtime:
    name: Restored runtime modules (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check restored modules
        run: >
          python -m py_compile
          03-Sources/openpdf_atomic_output.py
          03-Sources/openpdf_source_integrity_v430.py
          03-Sources/openpdf_page_source_integrity_v435.py
          03-Sources/openpdf_split_integrity_v449.py
          03-Sources/openpdf_inno_recipe_v491.py
      - name: Run 13 functional regression tests
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_runtime_reconciliation_v503.py -v

name: V51.0 Office editable scan preflight and regression
on:
  pull_request:
    paths:
      - '03-Sources/openpdf_office_scan_gate_v510.py'
      - '03-Sources/openpdf_conversion_service_v351.py'
      - '04-Tests-et-Qualification/test_office_scan_gate_v510.py'
      - '.github/workflows/office-scan-v510.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  office-scan-functional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Office conversion and synthetic fixture dependencies
        run: python -m pip install "PyMuPDF>=1.24,<2" "python-docx>=1.1,<2" "python-pptx>=1.0,<2" "openpyxl>=3.1,<4" "Pillow>=10,<13"
      - name: V51.0 scanned PDF gate (functional, not native Windows GUI)
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_office_scan_gate_v510.py -v
      - name: Source reconciliation and 91-module runtime closure
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_source_reconciliation_v503.py -v
      - name: Transactional runtime regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_runtime_reconciliation_v503.py -v

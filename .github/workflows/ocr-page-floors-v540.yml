name: V540 OCR independent per-page fidelity floors
on:
  pull_request:
    paths:
      - '03-Sources/openpdf_ocr_reference_corpus_v539.py'
      - '04-Tests-et-Qualification/test_ocr_page_floors_v540.py'
      - '04-Tests-et-Qualification/test_ocr_reference_*_v539.py'
      - '.github/workflows/ocr-page-floors-v540.yml'
  push:
    branches:
      - 'feature/v51.4-ocr-page-floors-v540-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  page-floors:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned-range PDF reader
        run: python -m pip install "PyMuPDF>=1.24,<2"
      - name: Compile reference gate and tests
        run: python -m py_compile 03-Sources/openpdf_ocr_reference_corpus_v539.py 04-Tests-et-Qualification/test_ocr_page_floors_v540.py
      - name: Test independent page quality floors against serialized PDFs
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_ocr_page_floors_v540.py -v
      - name: Regression V539 independent corpus gate
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_ocr_reference_corpus_v539.py -v
      - name: Regression V487 OCR CER/WER
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_ocr_quality_v487.py -v
      - name: Regression V488 OCR acceptance policy
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_ocr_quality_gate_v488.py -v

name: V51.4 editable XLSX table extraction and regression
on:
  pull_request:
    paths:
      - '03-Sources/openpdf_xlsx_tables_v514.py'
      - '03-Sources/openpdf_conversion_service_v351.py'
      - '03-Sources/openpdf_office_roundtrip_v459.py'
      - '03-Sources/openpdf_studio.py'
      - '03-Sources/openpdf_desktop.py'
      - '03-Sources/openpdf_operations.py'
      - 'VERSION.txt'
      - '07-Manifestes/V51.4-REQUIRED-RUNTIME-MODULES.json'
      - '04-Tests-et-Qualification/test_xlsx_tables_v514.py'
      - '04-Tests-et-Qualification/test_xlsx_merged_cells_v515.py'
      - '03-Sources/openpdf_xlsx_fidelity_v515.py'
      - '04-Tests-et-Qualification/test_xlsx_fidelity_v515.py'
      - '04-Tests-et-Qualification/test_xlsx_relationships_v516.py'
      - '03-Sources/openpdf_xlsx_ground_truth_v517.py'
      - '03-Sources/openpdf_xlsx_corpus_gate_v519.py'
      - '04-Tests-et-Qualification/test_xlsx_ground_truth_v517.py'
      - '04-Tests-et-Qualification/test_xlsx_corpus_gate_v519.py'
      - '04-Tests-et-Qualification/test_xlsx_blank_cells_v520.py'
      - '04-Tests-et-Qualification/test_xlsx_phantom_structures_v521.py'
      - '04-Tests-et-Qualification/test_xlsx_borderless_v522.py'
      - '04-Tests-et-Qualification/test_xlsx_mixed_v523.py'
      - '04-Tests-et-Qualification/test_xlsx_reading_order_v524.py'
      - '04-Tests-et-Qualification/test_xlsx_independent_corpus_v525.py'
      - '04-Tests-et-Qualification/test_xlsx_staggered_order_v526.py'
      - '04-Tests-et-Qualification/test_xlsx_case_quality_v527.py'
      - '04-Tests-et-Qualification/test_source_reconciliation_v503.py'
      - '07-Manifestes/V51.4-SOURCE-HASH-OVERRIDES.json'
      - '.github/workflows/xlsx-tables-v514.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xlsx-tables:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install functional dependencies
        run: python -m pip install "PyMuPDF>=1.26,<2" "openpyxl>=3.1,<4" "python-docx>=1.1,<2" "python-pptx>=1.0,<2" "Pillow>=10,<13"
      - name: Compile modified Python modules
        run: python -m py_compile 03-Sources/openpdf_xlsx_tables_v514.py 03-Sources/openpdf_xlsx_fidelity_v515.py 03-Sources/openpdf_xlsx_ground_truth_v517.py 03-Sources/openpdf_xlsx_corpus_gate_v519.py 03-Sources/openpdf_conversion_service_v351.py 03-Sources/openpdf_office_roundtrip_v459.py 03-Sources/openpdf_studio.py
      - name: V51.4 real PDF table extraction, formula and rollback tests
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_tables_v514.py -v
      - name: Real PDF merged-cell fidelity, formula and fail-closed tests
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_merged_cells_v515.py -v
      - name: XLSX archive security, exact-cell audit and rollback (real PDFs)
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_fidelity_v515.py -v
      - name: OOXML relationship security and real-PDF rollback regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_relationships_v516.py -v
      - name: Independent annotated ground-truth cell and merge metrics (real PDF)
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_ground_truth_v517.py -v
      - name: Independent multi-document corpus fidelity gate (real PDF conversion and adversarial cases)
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_corpus_gate_v519.py -v
      - name: V520 blank-cell false-positive and corpus gate regression (real PDF)
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_blank_cells_v520.py -v
      - name: V521 phantom blank tables and merged ranges regression (real PDFs)
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_phantom_structures_v521.py -v
      - name: V522 borderless multipage PDF to editable Excel and prose safety regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_borderless_v522.py -v
      - name: V523 mixed ruled and borderless tables, geometry and mutation regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_mixed_v523.py -v
      - name: V524 mixed-table visual reading order (real PDF to XLSX, mutation)
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_reading_order_v524.py -v
      - name: V525 independent real-PDF corpus diversity and tamper-detection
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_independent_corpus_v525.py -v
      - name: V526 staggered multi-column PDF reading order (real PDF to XLSX)
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_staggered_order_v526.py -v
      - name: V527 per-case XLSX release floors and real PDF mutation regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_case_quality_v527.py -v
      - name: V51.4 GUI routing and safety regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_xlsx_gui_v514.py -v
      - name: V51.0 Office scan preflight regression
        run: python -m unittest discover -s 04-Tests-et-Qualification -p test_office_scan_gate_v510.py -v
